<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feeds | AGI Talent</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{color-scheme:dark;--bg:#07110f;--panel:rgba(12,28,23,.92);--line:rgba(194,255,231,.16);--text:#eff8f4;--muted:rgba(239,248,244,.68);--accent:#47e5a5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,rgba(71,229,165,.13),transparent 32%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,sans-serif}main{width:min(100% - 32px,1040px);margin:40px auto}.brand{display:inline-flex;padding:24px 28px;margin-bottom:16px}.brand img{display:block;width:88px;height:auto;object-fit:contain}.panel{border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:clamp(18px,4vw,34px);box-shadow:0 28px 70px #0004}.search{display:flex;gap:10px;margin-bottom:22px}.search input{flex:1;min-width:0;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:#fff1;color:var(--text);font:inherit}.search button,.pagination button,.pagination input{padding:10px 16px;border:1px solid #47e5a580;border-radius:9px;background:#47e5a512;color:var(--accent);font:inherit}.search button,.pagination button{cursor:pointer}.search button{font-weight:700}.search button:disabled,.pagination button:disabled{opacity:.4;cursor:default}.pagination input{width:82px;text-align:center}.status{color:var(--muted);min-height:26px;margin:0 0 10px}.record{padding:19px 0;border-top:1px solid var(--line)}.record h2{font-size:1.05rem;font-weight:400;font-style:italic;margin:0 0 8px}.record .name{color:var(--accent);font-size:.86rem;font-weight:700;margin-bottom:5px}.record .update{white-space:pre-wrap;overflow-wrap:anywhere}.record time{display:block;color:var(--muted);font-size:.8rem;margin-top:9px}.pagination{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}.pagination span{color:var(--muted)}.empty{color:var(--muted);padding:22px 0;border-top:1px solid var(--line)}@media(max-width:480px){main{margin:18px auto}.search{flex-wrap:wrap}.search input{flex-basis:100%}.search button{width:100%}}
    .auth-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.auth-actions button,.auth-dialog button{padding:10px 16px;border:1px solid #47e5a580;border-radius:9px;background:#47e5a512;color:var(--accent);font:inherit;cursor:pointer}.auth-dialog{color:var(--text);background:#0c1c17;border:1px solid var(--line);border-radius:20px;width:min(440px,calc(100% - 32px));padding:24px}.auth-dialog::backdrop{background:#0009}.auth-dialog label{display:block;margin:12px 0}.auth-dialog input{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff1;color:var(--text);font:inherit}.auth-dialog h2{margin-top:0}.pagination input:disabled,.auth-dialog button:disabled{opacity:.4}.auth-actions [hidden],.auth-dialog [hidden]{display:none}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="AGI Talent home"><img src="/agitalent-logo.png" alt="AGI Talent"></a>
    <section class="panel">
      <div class="auth-actions"><span id="account-status" role="status">Log in or sign up to browse more pages.</span><button id="login" type="button">Log in</button><button id="signup" type="button">Sign Up</button><button id="logout" type="button" hidden>Log out</button></div>
      <form class="search" id="feed-search"><input id="query" type="search" placeholder="Search keywords…" aria-label="Search keywords"><button type="submit">Search</button></form>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div id="results"></div>
      <nav class="pagination" aria-label="Feed pages"><button id="previous" type="button">← Previous</button><span id="page"></span><label for="page-number">Go to</label><input id="page-number" type="number" min="1" step="1" inputmode="numeric" aria-label="Page number"><button id="go" type="button">Go</button><button id="next" type="button">Next →</button></nav>
    </section>
  </main>
  <dialog id="auth-dialog" class="auth-dialog" aria-labelledby="auth-title">
    <form id="auth-form">
      <h2 id="auth-title">Log in</h2>
      <label>Username<input id="auth-username" autocomplete="username" required></label>
      <label>Password<input id="auth-password" type="password" autocomplete="current-password" required></label>
      <label id="invitation-field" hidden>Invitation code<input id="auth-code" autocomplete="off" placeholder="ABCD-EFGH-IJKL"></label>
      <p id="auth-error" role="alert"></p>
      <button id="auth-submit" type="submit">Log in</button> <button id="auth-close" type="button">Cancel</button>
    </form>
  </dialog>
  <script>
    (()=>{
      const SUPABASE_URL='https://zocovvewzpqxspysanyy.supabase.co';
      const SUPABASE_KEY='sb_publishable_oa_OMpSd3ySK3WQPeKDLHA_aNZXcSIv';
      const supabase=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY),PAGE_SIZE=20;
      let currentPage=1,total=0,searchTerm='';
      const byId=id=>document.getElementById(id);
      const SESSION_KEY='talentsAdminSession';
      let user=null,authMode='login',authVersion=0,loading=false,loadVersion=0;
      function updateControls(){
        byId('previous').disabled=!user||loading||currentPage<=1;
        byId('next').disabled=!user||loading||currentPage*PAGE_SIZE>=total;
        byId('go').disabled=!user||loading||!total;
        byId('page-number').disabled=!user||loading||!total;
        byId('login').hidden=Boolean(user);byId('signup').hidden=Boolean(user);byId('logout').hidden=!user;
        byId('account-status').textContent=user?`Signed in as ${user.username}`:'Log in or sign up to browse more pages.';
      }
      async function restoreSession(){
        const version=++authVersion;
        user=null;updateControls();
        try{
          const saved=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
          if(saved?.username&&saved?.password&&supabase){
            const {data,error}=await supabase.rpc('authenticate_app_user',{p_username:saved.username,p_password:saved.password});
            if(version!==authVersion)return;
            if(!error&&data?.username)user=data;
          }
        }catch(_error){/* Invalid or unavailable sessions leave browsing on the first page. */}
        if(version!==authVersion)return;
        updateControls();
        if(!user&&currentPage>1)loadPage(1);
      }
      function openAuth(mode){
        authMode=mode;byId('auth-form').reset();byId('auth-error').textContent='';
        const signup=mode==='signup';
        byId('auth-title').textContent=byId('auth-submit').textContent=signup?'Sign Up':'Log in';
        byId('invitation-field').hidden=!signup;byId('auth-code').required=signup;
        byId('auth-password').autocomplete=signup?'new-password':'current-password';
        byId('auth-dialog').showModal();
      }
      byId('login').addEventListener('click',()=>openAuth('login'));
      byId('signup').addEventListener('click',()=>openAuth('signup'));
      byId('auth-close').addEventListener('click',()=>byId('auth-dialog').close());
      byId('auth-form').addEventListener('submit',async event=>{
        event.preventDefault();const version=++authVersion;
        byId('auth-submit').disabled=true;byId('auth-error').textContent='';
        try{
          if(!supabase)throw new Error('Account service is unavailable.');
          const username=byId('auth-username').value.trim(),password=byId('auth-password').value;
          const args={p_username:username,p_password:password};
          if(authMode==='signup')args.p_invitation_code=byId('auth-code').value.trim().toUpperCase().replace(/\s+/g,'').replace(/[^A-Z0-9-]/g,'');
          const {data,error}=await supabase.rpc(authMode==='signup'?'register_app_user_with_invitation':'authenticate_app_user',args);
          if(version!==authVersion)return;
          if(error)throw error;
          if(!data?.username)throw new Error('Unable to sign in. Please check your details.');
          localStorage.setItem(SESSION_KEY,JSON.stringify({username:data.username,password}));
          user=data;updateControls();byId('auth-form').reset();byId('auth-dialog').close();
        }catch(error){byId('auth-error').textContent=error.message||'Unable to sign in.';}
        finally{byId('auth-submit').disabled=false;}
      });
      byId('logout').addEventListener('click',()=>{
        ++authVersion;user=null;localStorage.removeItem(SESSION_KEY);updateControls();
        supabase?.auth.signOut().catch(()=>null);loadPage(1);
      });
      window.addEventListener('storage',event=>{if(event.key===SESSION_KEY||event.key===null)restoreSession();});
      window.addEventListener('focus',()=>restoreSession());
      const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      async function loadPage(page=1){
        if(!Number.isInteger(page)||page<1||(!user&&page!==1))return;
        if(!supabase){byId('status').textContent='Feed service is unavailable.';return;}
        const version=++loadVersion;loading=true;updateControls();
        currentPage=page;byId('status').textContent='Loading…';byId('results').replaceChildren();
        let query=supabase.from('feeds').select('name,title,update,date',{count:'exact'}).order('date',{ascending:false}).order('id',{ascending:false});
        if(searchTerm){const safe=searchTerm.replace(/[,%()]/g,' ').trim();if(safe)query=query.or(`name.ilike.%${safe}%,title.ilike.%${safe}%,update.ilike.%${safe}%`);}
        const{data,error,count}=await query.range((page-1)*PAGE_SIZE,page*PAGE_SIZE-1);
        if(version!==loadVersion)return;
        loading=false;
        if(error){total=0;updateControls();byId('status').textContent=/relation .*feeds.* does not exist|schema cache|PGRST20[25]/i.test(error.message)?'The feeds table is not available in Supabase yet. Please try again later.':`Could not load feeds: ${error.message}`;byId('page').textContent='';return;}
        total=count||0;byId('status').textContent=total?`${total.toLocaleString()} record${total===1?'':'s'}${searchTerm?' found':''}`:'No matching feeds.';
        const results=byId('results');
        if(data?.length)data.forEach(row=>{const item=document.createElement('article');item.className='record';item.innerHTML=`<div class="name">${escapeHtml(row.name)}</div><h2>${escapeHtml(row.title)}</h2><div class="update">${escapeHtml(row.update)}</div><time>${escapeHtml(row.date)}</time>`;results.append(item);});
        else results.innerHTML='<div class="empty">Try another keyword.</div>';
        byId('page').textContent=total?`Page ${currentPage} of ${Math.max(1,Math.ceil(total/PAGE_SIZE))}`:'';
        byId('page-number').max=Math.max(1,Math.ceil(total/PAGE_SIZE));
        byId('page-number').value=total?currentPage:'';
        updateControls();
      }
      byId('feed-search').addEventListener('submit',event=>{event.preventDefault();searchTerm=byId('query').value.trim();loadPage(1);});
      byId('previous').addEventListener('click',()=>loadPage(currentPage-1));
      byId('next').addEventListener('click',()=>loadPage(currentPage+1));
      byId('go').addEventListener('click',()=>{if(!user)return;const requested=Number.parseInt(byId('page-number').value,10),lastPage=Math.max(1,Math.ceil(total/PAGE_SIZE));if(Number.isInteger(requested)&&requested>=1&&requested<=lastPage)loadPage(requested);});
      byId('page-number').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();byId('go').click();}});
      updateControls();restoreSession();loadPage();
    })();
  </script>
</body>
</html>
